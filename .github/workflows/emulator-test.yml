name: emulator-test

# Runs the app end-to-end on a KVM-accelerated Android emulator so recording
# regressions (crash on consent, phantom "Recording…", button not resetting)
# are caught BEFORE the APK is deployed to the site.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/emulator-test.yml'
  pull_request:
    paths:
      - 'app/**'

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ReactiveCircus's documented KVM setup: make /dev/kvm accessible to the
      # runner user. Without this the emulator falls back to (very slow) software
      # mode, and adb can fail to come up — which is what broke the first run.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # Single reactivecircus invocation: builds + installs + boots the emulator
      # + runs the test against it, all sharing the same device (separate
      # invocations don't reliably share the booted emulator → adb 5037).
      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: free-song-ci
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: |
            ./gradlew :app:assembleDebugAndroidTest
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Archive test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/androidTests
          if-no-files-found: warn